<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Light Mode: Deep Sleek Dark Monogram with Indigo Edge -->
    <linearGradient id="drDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Dark Mode: Crisp Glowing White & Ice-Blue Monogram -->
    <linearGradient id="drLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="drGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#818cf8" flood-opacity="0.6"/>
    </filter>

    <filter id="drShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    /* Default / Light Theme: Dark Text */
    .dr-text {
      fill: url(#drDarkGrad);
      filter: url(#drShadowLight);
    }

    /* Dark Theme: Light Text */
    @media (prefers-color-scheme: dark) {
      .dr-text {
        fill: url(#drLightGrad);
        filter: url(#drGlowDark);
      }
    }
  </style>

  <text
    class="dr-text"
    x="16"
    y="24"
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif"
    font-size="22"
    font-weight="900"
    letter-spacing="-1px"
    text-anchor="middle"
  >
    DR
  </text>
</svg>